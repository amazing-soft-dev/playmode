<!-- playermode:game id=puzzle scoreMin=0 scoreMax=50000 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GRID SHIFT</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none;outline:none}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="GRID SHIFT - sliding match puzzle"></canvas>
<script>
window.addEventListener("error", e => parent.postMessage({ type: "error", message: String(e.message).slice(0, 300) }, "*"));
/* =====================================================================
   PLAYERMODE STARTER TEMPLATE  -  GRID SHIFT  (sliding match puzzle)
   ---------------------------------------------------------------------
   Slide a whole row or column (it wraps around). Three or more equal
   shapes in a straight line clear, tiles fall, cascades raise the combo.
   60 second round; clearing 4+ in one line adds +2 seconds.
   LOOP     requestAnimationFrame(frame) -> update(dt) -> draw()
            dt in seconds, clamped to 50 ms; update() skipped while paused.
   STATES   "title" -> "play" -> "over" -> (Space / R / tap) -> "play"
            board phase inside play: "idle" -> "clear" -> "fall" -> ...
   LOGICAL  480 x 360, letterboxed and devicePixelRatio aware.
   CUSTOMIZE
     CONFIG ........ grid size, shapes, timer, bonus seconds
     startClear() .. scoring rules (points, combo, time bonus)
     drawShape() ... tile art (vector only)
     reportScore() . sends the final score once per run
   RULES    single file, no network, no storage, system fonts only.
   ===================================================================== */
(function () {
"use strict";

// ------------------------------------------------------------ CONFIG
const VIEW_W = 480, VIEW_H = 360;
const SCORE_MIN = 0, SCORE_MAX = 50000;
const COL = { bg: "#000", fg: "#fff", grey: "#7b7878", dark: "#333", accent: "#C6FF3D" };
const FONT = "ui-monospace, monospace";
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
// The title comes from <title>, so a game made from this template shows its own name.
const GAME_TITLE = (document.title || "GRID SHIFT").trim().toUpperCase();

const N = 6;                     // grid is N x N
const CELL = 48;
const L = N * CELL;              // board size in px
const GX = (VIEW_W - L) / 2, GY = 52;
const SHAPES = 5;                // circle, square, triangle, diamond, cross
const ROUND_TIME = 60, BONUS_SEC = 2, MAX_TIME = 99;
const CLEAR_TIME = 0.24;

// ------------------------------------------------------------ CANVAS + LETTERBOX
const canvas = document.getElementById("game");
canvas.setAttribute("aria-label", GAME_TITLE + " - sliding match puzzle");
const ctx = canvas.getContext("2d");
const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth || VIEW_W, h = window.innerHeight || VIEW_H;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  view.dpr = dpr;
  view.scale = Math.min(w / VIEW_W, h / VIEW_H);
  view.ox = (w - VIEW_W * view.scale) / 2;
  view.oy = (h - VIEW_H * view.scale) / 2;
}
window.addEventListener("resize", resize);
resize();
function toLogical(e) { return { x: (e.clientX - view.ox) / view.scale, y: (e.clientY - view.oy) / view.scale }; }

function beginFrame() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const k = view.scale * view.dpr;
  ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, VIEW_W, VIEW_H);
  ctx.clip();
}
function endFrame() { ctx.restore(); }

function text(str, x, y, size, color, align, bold) {
  ctx.font = (bold ? "bold " : "") + size + "px " + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
}
// Largest bold size up to `max` at which `str` fits the view with a 20px margin each side.
function fitSize(str, max) {
  ctx.font = "bold " + max + "px " + FONT;
  const w = ctx.measureText(str).width;
  return w > VIEW_W - 40 ? Math.floor((max * (VIEW_W - 40)) / w) : max;
}
function pad(n, len) { return String(Math.max(0, Math.floor(n))).padStart(len, "0"); }
function mod(a, m) { return ((a % m) + m) % m; }

// ------------------------------------------------------------ SCORE REPORTING
let reported = false;
function reportScore(v) {
  if (reported) return;
  reported = true;
  const value = Math.max(SCORE_MIN, Math.min(SCORE_MAX, Math.floor(v) || 0));
  parent.postMessage({ type: "score", value: value }, "*");
}

// ------------------------------------------------------------ STATE
let state = "title";   // "title" | "play" | "over"
let paused = false, overT = 0, best = 0, clock = 0;
let grid;              // grid[r][c] = { t, dy, vy, pop }
let phase, phaseT, combo, maxCombo, score, timeLeft, cleared, moves;
let cursor, grabbed, usingKeys, drag, settle, hint, idleT;
let popups, parts, shake, flash;

function newTile(t) {
  return { t: t === undefined ? (Math.random() * SHAPES) | 0 : t, dy: 0, vy: 0, pop: false };
}

function buildBoard() {
  for (let attempt = 0; attempt < 60; attempt++) {
    grid = [];
    for (let r = 0; r < N; r++) {
      const row = [];
      for (let c = 0; c < N; c++) {
        let t;
        do { t = (Math.random() * SHAPES) | 0; }
        while ((c >= 2 && row[c - 1].t === t && row[c - 2].t === t) ||
               (r >= 2 && grid[r - 1][c].t === t && grid[r - 2][c].t === t));
        row.push(newTile(t));
      }
      grid.push(row);
    }
    if (findMove()) return;
  }
}
function dropIn() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    grid[r][c].dy = -L - 20 - c * 16;
    grid[r][c].vy = 0;
  }
  phase = "fall";
}

function reset() {
  score = 0; timeLeft = ROUND_TIME; combo = 1; maxCombo = 1; cleared = 0; moves = 0;
  cursor = { r: 2, c: 2 }; grabbed = false; drag = null; settle = null; hint = null; idleT = 0;
  popups = []; parts = []; shake = 0; flash = 0; phaseT = 0;
  reported = false;
  buildBoard();
  dropIn();
}
reset();

function startGame() { reset(); state = "play"; paused = false; }

function endGame() {
  state = "over"; overT = 0; grabbed = false; drag = null;
  if (score > best) best = score;
  flash = REDUCED ? 0 : 0.6;
  reportScore(score);
}

// ------------------------------------------------------------ BOARD LOGIC
function findMatches() {
  const mark = [];
  for (let r = 0; r < N; r++) mark.push(new Array(N).fill(false));
  const groups = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      let e = c + 1;
      while (e < N && grid[r][e].t === grid[r][c].t) e++;
      if (e - c >= 3) { groups.push(e - c); for (let k = c; k < e; k++) mark[r][k] = true; }
      c = e;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      let e = r + 1;
      while (e < N && grid[e][c].t === grid[r][c].t) e++;
      if (e - r >= 3) { groups.push(e - r); for (let k = r; k < e; k++) mark[k][c] = true; }
      r = e;
    }
  }
  let count = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (mark[r][c]) count++;
  return { mark: mark, count: count, groups: groups };
}

function anyMatch(T) {
  for (let r = 0; r < N; r++) {
    let run = 1;
    for (let c = 1; c < N; c++) { run = T[r][c] === T[r][c - 1] ? run + 1 : 1; if (run >= 3) return true; }
  }
  for (let c = 0; c < N; c++) {
    let run = 1;
    for (let r = 1; r < N; r++) { run = T[r][c] === T[r - 1][c] ? run + 1 : 1; if (run >= 3) return true; }
  }
  return false;
}

// Returns the first slide that makes a match: { axis, i, k } or null.
function findMove() {
  const T = grid.map(row => row.map(t => t.t));
  for (let i = 0; i < N; i++) {
    for (let k = 1; k < N; k++) {
      const A = T.map(row => row.slice());
      for (let c = 0; c < N; c++) A[i][c] = T[i][mod(c - k, N)];
      if (anyMatch(A)) return { axis: "row", i: i, k: k };
      const B = T.map(row => row.slice());
      for (let r = 0; r < N; r++) B[r][i] = T[mod(r - k, N)][i];
      if (anyMatch(B)) return { axis: "col", i: i, k: k };
    }
  }
  return null;
}

// Rotate row/column i by k cells. `residual` is the visual offset (px) the line starts
// from so it glides into place.
function doShift(axis, i, k, residual) {
  k = mod(k, N);
  if (k !== 0) {
    if (axis === "row") {
      const old = grid[i].slice();
      for (let c = 0; c < N; c++) grid[i][c] = old[mod(c - k, N)];
    } else {
      const old = grid.map(row => row[i]);
      for (let r = 0; r < N; r++) grid[r][i] = old[mod(r - k, N)];
    }
    moves++;
  }
  settle = Math.abs(residual) > 0.5 ? { axis: axis, i: i, off: residual } : null;
  idleT = 0; hint = null;
  if (k !== 0) {
    const m = findMatches();
    if (m.count) { combo = 1; startClear(m); }
  }
}

function startClear(m) {
  phase = "clear"; phaseT = 0; grabbed = false; idleT = 0; hint = null;
  let sx = 0, sy = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!m.mark[r][c]) continue;
    grid[r][c].pop = true;
    sx += c; sy += r;
    burst(GX + (c + 0.5) * CELL, GY + (r + 0.5) * CELL, 5);
  }
  let pts = m.count * 10;
  for (const g of m.groups) pts += Math.max(0, g - 3) * 20;
  pts *= combo;
  score += pts;
  cleared += m.count;
  if (combo > maxCombo) maxCombo = combo;
  const cx = GX + (sx / m.count + 0.5) * CELL, cy = GY + (sy / m.count + 0.5) * CELL;
  popups.push({ x: cx, y: cy, txt: "+" + pts + (combo > 1 ? "  x" + combo : ""), life: 1 });
  if (timeLeft > 0 && m.groups.some(g => g >= 4)) {
    timeLeft = Math.min(MAX_TIME, timeLeft + BONUS_SEC);
    popups.push({ x: cx, y: cy + 16, txt: "+" + BONUS_SEC + " SEC", life: 1 });
  }
  if (combo >= 3 && !REDUCED) shake = 3;
}

function collapse() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const t = grid[r][c];
      if (!t.pop) {
        if (w !== r) { grid[w][c] = t; t.dy -= (w - r) * CELL; }
        w--;
      }
    }
    const k = w + 1;
    for (let r = w; r >= 0; r--) { const t = newTile(); t.dy = -k * CELL - 10; grid[r][c] = t; }
  }
  phase = "fall";
}

function updateFall(dt) {
  let done = true;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c];
    if (t.dy < 0) {
      t.vy += 2600 * dt;
      t.dy += t.vy * dt;
      if (t.dy >= 0) { t.dy = 0; t.vy = 0; } else done = false;
    }
  }
  return done;
}

// ------------------------------------------------------------ PARTICLES
function burst(x, y, n) {
  const k = REDUCED ? 0.5 : 1;
  for (let i = 0; i < n * k; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, max: 0.5 });
  }
}

// ------------------------------------------------------------ UPDATE
function update(dt) {
  overT += dt;
  shake = Math.max(0, shake - 20 * dt);
  flash = Math.max(0, flash - 2 * dt);
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].life -= dt; popups[i].y -= 24 * dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
  if (settle) {
    settle.off -= settle.off * Math.min(1, dt * 16);
    if (Math.abs(settle.off) < 0.5) settle = null;
  }
  if (state !== "play") { updateFall(dt); return; }

  if (timeLeft > 0) {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0; grabbed = false;
      if (drag && !drag.axis) drag = null;
    }
  }

  if (phase === "clear") {
    phaseT += dt;
    if (phaseT >= CLEAR_TIME) collapse();
  } else if (phase === "fall") {
    if (updateFall(dt)) {
      const m = findMatches();
      if (m.count) { combo++; startClear(m); }
      else {
        combo = 1; phase = "idle";
        if (!findMove()) {
          buildBoard(); dropIn();
          popups.push({ x: VIEW_W / 2, y: GY + L / 2, txt: "NO MOVES - SHUFFLE", life: 1.2 });
        }
      }
    }
  } else {
    idleT += dt;
    if (idleT > 6 && !hint && !drag && timeLeft > 0) hint = findMove();
  }

  if (timeLeft <= 0 && phase === "idle" && !drag && !settle) endGame();
}

// ------------------------------------------------------------ DRAW
function draw() {
  beginFrame();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  drawBoard();
  ctx.restore();
  drawHUD();
  if (state === "title") drawTitle();
  else if (state === "over") drawOver();
  if (paused) drawPaused();
  if (flash > 0) {
    ctx.fillStyle = "rgba(198,255,61," + (flash * 0.25).toFixed(3) + ")";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  endFrame();
}

// Tile art. t: 0 circle, 1 square, 2 triangle, 3 diamond, 4 cross.
function drawShape(t, cx, cy, s, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  if (t === 0) {
    ctx.fillStyle = color || COL.fg;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
  } else if (t === 1) {
    ctx.strokeStyle = color || COL.fg;
    ctx.strokeRect(-s + 1.5, -s + 1.5, s * 2 - 3, s * 2 - 3);
    ctx.fillStyle = color || COL.fg;
    ctx.fillRect(-3, -3, 6, 6);
  } else if (t === 2) {
    ctx.fillStyle = color || COL.grey;
    ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, s * 0.85); ctx.lineTo(-s, s * 0.85); ctx.closePath(); ctx.fill();
  } else if (t === 3) {
    ctx.strokeStyle = color || COL.fg;
    ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0); ctx.closePath(); ctx.stroke();
  } else {
    ctx.fillStyle = color || COL.fg;
    const w = s * 0.55;
    ctx.fillRect(-w / 2, -s, w, s * 2);
    ctx.fillRect(-s, -w / 2, s * 2, w);
  }
  ctx.restore();
}

function drawTile(t, x, y) {
  let s = 14, color = null, alpha = 1;
  if (t.pop && phase === "clear") {
    const k = Math.min(1, phaseT / CLEAR_TIME);
    s = 14 * (1 + k * 0.45);
    alpha = 1 - k;
    color = COL.accent;
  }
  ctx.globalAlpha = alpha;
  drawShape(t.t, x + CELL / 2, y + CELL / 2, s, color);
  ctx.globalAlpha = 1;
}

// Which line (if any) is visually offset right now, and by how much.
function lineOffset(r, c) {
  if (drag && drag.axis) {
    if (drag.axis === "row" && drag.r === r) return { a: "row", off: drag.off };
    if (drag.axis === "col" && drag.c === c) return { a: "col", off: drag.off };
  }
  if (settle) {
    if (settle.axis === "row" && settle.i === r) return { a: "row", off: settle.off };
    if (settle.axis === "col" && settle.i === c) return { a: "col", off: settle.off };
  }
  return null;
}

function drawBoard() {
  ctx.strokeStyle = COL.grey; ctx.lineWidth = 1;
  ctx.strokeRect(GX - 4.5, GY - 4.5, L + 9, L + 9);
  ctx.save();
  ctx.beginPath(); ctx.rect(GX, GY, L, L); ctx.clip();

  ctx.strokeStyle = COL.dark;
  ctx.beginPath();
  for (let i = 1; i < N; i++) {
    ctx.moveTo(GX + i * CELL + 0.5, GY); ctx.lineTo(GX + i * CELL + 0.5, GY + L);
    ctx.moveTo(GX, GY + i * CELL + 0.5); ctx.lineTo(GX + L, GY + i * CELL + 0.5);
  }
  ctx.stroke();

  // highlight the line being dragged / the grabbed cross
  ctx.fillStyle = "rgba(198,255,61,0.08)";
  if (drag && drag.axis === "row") ctx.fillRect(GX, GY + drag.r * CELL, L, CELL);
  else if (drag && drag.axis === "col") ctx.fillRect(GX + drag.c * CELL, GY, CELL, L);
  else if (state === "play" && usingKeys && grabbed) {
    ctx.fillRect(GX, GY + cursor.r * CELL, L, CELL);
    ctx.fillRect(GX + cursor.c * CELL, GY, CELL, L);
  }

  // hint: pulse the line that can make a match
  if (state === "play" && hint && phase === "idle" && !drag) {
    ctx.globalAlpha = REDUCED ? 0.7 : 0.45 + 0.35 * Math.sin(clock * 6);
    ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
    if (hint.axis === "row") ctx.strokeRect(GX + 2, GY + hint.i * CELL + 2, L - 4, CELL - 4);
    else ctx.strokeRect(GX + hint.i * CELL + 2, GY + 2, CELL - 4, L - 4);
    ctx.globalAlpha = 1;
  }

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c];
    const lo = lineOffset(r, c);
    const x = c * CELL, y = r * CELL + t.dy;
    if (lo && lo.a === "row") {
      const xx = mod(x + lo.off, L);
      drawTile(t, GX + xx, GY + y);
      if (xx > L - CELL) drawTile(t, GX + xx - L, GY + y);
    } else if (lo && lo.a === "col") {
      const yy = mod(y + lo.off, L);
      drawTile(t, GX + x, GY + yy);
      if (yy > L - CELL) drawTile(t, GX + x, GY + yy - L);
    } else {
      drawTile(t, GX + x, GY + y);
    }
  }

  for (const q of parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = COL.accent;
    ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // keyboard cursor
  if (state === "play" && usingKeys) {
    const x = GX + cursor.c * CELL, y = GY + cursor.r * CELL;
    ctx.strokeStyle = COL.accent;
    ctx.lineWidth = grabbed ? 3 : 2;
    ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
    if (grabbed) {
      ctx.fillStyle = COL.accent;
      const m = CELL / 2;
      tri(x - 3, y + m, -1, 0); tri(x + CELL + 3, y + m, 1, 0);
      tri(x + m, y - 3, 0, -1); tri(x + m, y + CELL + 3, 0, 1);
    }
  }

  for (const q of popups) {
    ctx.globalAlpha = Math.min(1, q.life * 2);
    text(q.txt, q.x, q.y, 12, COL.accent, "center", true);
  }
  ctx.globalAlpha = 1;
}

function tri(x, y, dx, dy) {
  ctx.beginPath();
  ctx.moveTo(x + dx * 5, y + dy * 5);
  ctx.lineTo(x - dy * 4, y + dx * 4);
  ctx.lineTo(x + dy * 4, y - dx * 4);
  ctx.closePath(); ctx.fill();
}

function drawHUD() {
  if (state === "title") return;
  text("[ SCORE ]", 16, 14, 9, COL.grey, "left");
  text(pad(score, 5), 16, 32, 20, COL.accent, "left", true);
  text("[ TIME ]", VIEW_W - 16, 14, 9, COL.grey, "right");
  const low = timeLeft < 10;
  const tc = low ? (REDUCED || Math.floor(clock * 4) % 2 === 0 ? COL.accent : COL.fg) : COL.fg;
  text(Math.ceil(timeLeft).toString(), VIEW_W - 16, 32, 20, tc, "right", true);
  if (combo > 1 && state === "play") text("[ COMBO ] x" + combo, VIEW_W / 2, 24, 12, COL.accent, "center", true);
  else text("[ BEST ] " + pad(Math.max(best, score), 5), VIEW_W / 2, 24, 10, COL.grey);
  // time bar
  ctx.fillStyle = COL.dark;
  ctx.fillRect(GX, 42, L, 2);
  ctx.fillStyle = COL.accent;
  ctx.fillRect(GX, 42, L * Math.min(1, timeLeft / ROUND_TIME), 2);
  const hintTxt = usingKeys ? "ARROWS MOVE  -  SPACE GRAB  -  ARROWS SLIDE" : "DRAG ANY ROW OR COLUMN TO SLIDE IT";
  text(state === "play" && hint ? "TIP: SLIDE THE GLOWING LINE" : hintTxt, VIEW_W / 2, VIEW_H - 9, 9, state === "play" && hint ? COL.accent : COL.grey);
}

function overlay(a) { ctx.fillStyle = "rgba(0,0,0," + a + ")"; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
function blinkOn() { return REDUCED || Math.floor(clock * 2.2) % 2 === 0; }

function drawTitle() {
  overlay(0.72);
  text(GAME_TITLE, VIEW_W / 2, 74, fitSize(GAME_TITLE, 38), COL.fg, "center", true);
  ctx.fillStyle = COL.accent;
  ctx.fillRect(VIEW_W / 2 - 110, 100, 220, 3);
  text("[ SLIDE. MATCH. CHAIN. ]", VIEW_W / 2, 118, 10, COL.grey);
  text("SLIDE A ROW OR COLUMN - IT WRAPS AROUND", VIEW_W / 2, 150, 10, COL.fg);
  text("LINE UP 3+ OF THE SAME SHAPE TO CLEAR THEM", VIEW_W / 2, 167, 10, COL.fg);
  text("TOUCH ... DRAG A TILE LEFT/RIGHT OR UP/DOWN", VIEW_W / 2, 192, 10, COL.grey);
  text("KEYS .... ARROWS MOVE, SPACE GRAB, ARROWS SLIDE", VIEW_W / 2, 209, 10, COL.grey);
  text("60 SECONDS  -  4 IN A LINE = +2 SEC  -  CASCADES = COMBO", VIEW_W / 2, 226, 10, COL.grey);
  if (blinkOn()) text("PRESS SPACE / TAP TO START", VIEW_W / 2, 272, 14, COL.accent, "center", true);
}

function drawOver() {
  overlay(0.75);
  text("TIME UP", VIEW_W / 2, 92, 34, COL.fg, "center", true);
  text("[ SCORE ]", VIEW_W / 2, 136, 10, COL.grey);
  text(pad(score, 5), VIEW_W / 2, 164, 32, COL.accent, "center", true);
  text("[ BEST ] " + pad(best, 5) + "   [ TOP COMBO ] x" + maxCombo, VIEW_W / 2, 200, 10, COL.fg);
  text("[ CLEARED ] " + cleared + "   [ SLIDES ] " + moves, VIEW_W / 2, 218, 10, COL.grey);
  if (overT > 0.6 && blinkOn()) text("SPACE / R / TAP TO RESTART", VIEW_W / 2, 262, 14, COL.accent, "center", true);
}

function drawPaused() {
  overlay(0.7);
  text("PAUSED", VIEW_W / 2, VIEW_H / 2 - 14, 28, COL.fg, "center", true);
  text("PRESS SPACE / TAP TO RESUME", VIEW_W / 2, VIEW_H / 2 + 20, 11, COL.accent);
}

// ------------------------------------------------------------ INPUT
const DIR_KEYS = {
  ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
  w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1], W: [-1, 0], S: [1, 0], A: [0, -1], D: [0, 1]
};

window.addEventListener("keydown", e => {
  const k = e.key;
  if (k === " " || k.indexOf("Arrow") === 0) e.preventDefault();
  const isAction = k === " " || k === "Enter";
  if (paused) { if (isAction && !e.repeat) paused = false; return; }
  if (state === "title") { if (isAction && !e.repeat) startGame(); return; }
  if (state === "over") {
    if ((isAction || k === "r" || k === "R") && !e.repeat && overT > 0.6) startGame();
    return;
  }
  if (k === "p" || k === "P" || k === "Escape") { paused = true; return; }
  usingKeys = true;
  if (timeLeft <= 0) return;
  const d = DIR_KEYS[k];
  if (d) {
    if (grabbed) {
      if (phase !== "idle" || drag) return;
      if (d[1] !== 0) {
        cursor.c = mod(cursor.c + d[1], N);
        doShift("row", cursor.r, d[1], -d[1] * CELL);
      } else {
        cursor.r = mod(cursor.r + d[0], N);
        doShift("col", cursor.c, d[0], -d[0] * CELL);
      }
    } else {
      cursor.r = mod(cursor.r + d[0], N);
      cursor.c = mod(cursor.c + d[1], N);
    }
    return;
  }
  if (isAction && !e.repeat && phase === "idle") grabbed = !grabbed;
});

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  try { canvas.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
  if (paused) { paused = false; return; }
  if (state === "title") { startGame(); return; }
  if (state === "over") { if (overT > 0.6) startGame(); return; }
  usingKeys = false; grabbed = false;
  if (timeLeft <= 0 || phase !== "idle" || drag) return;
  const p = toLogical(e);
  if (p.x < GX || p.y < GY || p.x >= GX + L || p.y >= GY + L) return;
  drag = { id: e.pointerId, r: Math.floor((p.y - GY) / CELL), c: Math.floor((p.x - GX) / CELL), x0: p.x, y0: p.y, axis: null, off: 0 };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});

window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = toLogical(e);
  const dx = p.x - drag.x0, dy = p.y - drag.y0;
  if (!drag.axis && (Math.abs(dx) > 7 || Math.abs(dy) > 7)) {
    drag.axis = Math.abs(dx) >= Math.abs(dy) ? "row" : "col";
    settle = null; hint = null;
  }
  if (drag.axis) {
    const v = drag.axis === "row" ? dx : dy;
    drag.off = Math.max(-(L - CELL), Math.min(L - CELL, v));
  }
});

function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (!d.axis) { cursor = { r: d.r, c: d.c }; return; }
  const i = d.axis === "row" ? d.r : d.c;
  if (e.type === "pointercancel") { settle = { axis: d.axis, i: i, off: d.off }; return; }
  const k = Math.round(d.off / CELL);
  doShift(d.axis, i, k, d.off - k * CELL);
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
canvas.addEventListener("contextmenu", e => e.preventDefault());

// ------------------------------------------------------------ MAIN LOOP
let last = 0;
function frame(ts) {
  const now = ts / 1000;
  let dt = last ? now - last : 0;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  clock += dt;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "play") paused = true;
  last = 0;
});
requestAnimationFrame(frame);
})();
</script>
