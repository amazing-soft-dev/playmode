name: Bug or fix
description: Something is broken or looks wrong
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Steps, page URL, screen width and browser.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
