# Weekly dependency updates. These pull requests are not opened or merged by the
# repository workflows (their branches are dependabot/*); a person reviews them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: ["type:build", "area:infra"]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
    labels: ["type:ci", "area:infra"]
