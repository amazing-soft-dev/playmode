name: Open pull request

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
      - "build/**"
      - dev

# Pushes to the same branch run one at a time so two runs never race to open the same pull request.
concurrency:
  group: open-pull-request-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  open:
    name: Open or update pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Open or update the pull request
        env:
          # A personal token, not GITHUB_TOKEN: events created with GITHUB_TOKEN do not start
          # other workflows, so CI and the merge workflow would never run.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/open-pull-request.sh
